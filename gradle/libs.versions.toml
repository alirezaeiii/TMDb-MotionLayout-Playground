timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

play-core = { group = "com.google.android.play", name = "core", version.ref = "playCore" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-config-ktx = { group = "com.google.firebase", name = "firebase-config-ktx" }
firebase-analytics-ktx = { group = "com.google.firebase", name = "firebase-analytics-ktx" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
androidx-arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "archLifecycle" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

test-runner = { group = "com.android.support.test", name = "runner", version.ref = "runner" }
test-rules = { group = "com.android.support.test", name = "rules", version.ref = "rules" }
espresso-core = { group = "com.android.support.test.espresso", name = "espresso-core", version.ref = "espresso" }
espresso-contrib = { group = "com.android.support.test.espresso", name = "espresso-contrib", version.ref = "espresso" }
espresso-intents = { group = "com.android.support.test.espresso", name = "espresso-intents", version.ref = "espresso" }
espresso-idling-resource = { group = "com.android.support.test.espresso", name = "espresso-idling-resource", version.ref = "espresso" }
okhttp3-idling-resource = { group = "com.jakewharton.espresso", name = "okhttp3-idling-resource", version.ref = "okhttpIdlingResource" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
legacy-kapt = { id = "com.android.legacy-kapt", version.ref = "agp" }
