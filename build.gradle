// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    id("com.android.application") version "9.0.0" apply false
    id("com.android.library") version "9.0.0" apply false
    id("com.google.gms.google-services") version "4.4.4" apply false
    id("com.google.dagger.hilt.android") version "2.60.1" apply false
    id("com.google.devtools.ksp") version "2.3.10" apply false
    id("org.jetbrains.kotlin.plugin.compose") version "2.4.20" apply false
    id("com.android.legacy-kapt") version "9.0.0" apply false
}

// Define versions in a single place
ext {
    minSdkVersion = 21
    targetSdkVersion = 35
    compileSdkVersion = 35

    // App dependencies
    appCompat = '1.5.1'
    compose = '1.1.1'
    activity_compose = '1.3.1'
    guavaVersion = '27.0.1-android'
    retrofitVersion = '2.9.0'
    glideVersion = '4.8.0'
    rxjavaVersion = '2.1.9'
    rxandroidVersion = '2.1.0'
    junitVersion = '4.12'
    mockitoVersion = '2.23.0'
    runnerVersion = '1.1.0'
    rulesVersion = '1.1.0'
    espressoVersion = '3.1.0'
    okhttpIdlingResourceVersion = '1.0.0'
    daggerVersion = '2.40.5'
    pagingVersion = '2.0.0'
    lifecycleVersion = '2.5.1'
    archLifecycleVersion = '2.1.0'
    gsonVersion = '2.8.5'
    timberVersion = '4.7.1'
    constraintLayoutVersion = '2.1.4'
    okhttpVersion = '4.11.0'
    circleimageviewVersion = '2.2.0'
    materialVersion = '1.6.1'
    swiperefreshVersion = '1.1.0'
    paletteVersion = '1.0.0'
    coroutinesVersion = '1.5.2'
    mockkVersion = '1.10.0'
}